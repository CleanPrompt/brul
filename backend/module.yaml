product: jvm/app

settings:
  kotlin:
    serialization: json
  jvm:
    release: 21
    mainClass: nl.example.backend.ApplicationKt
  ktor: enabled

dependencies:
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.server.statusPages
  - $ktor.server.callLogging
  - $ktor.server.auth
  - io.ktor:ktor-server-auth-jwt-jvm:3.6.0
  - $ktor.server.rateLimit

  - ch.qos.logback:logback-classic:1.5.18
  - io.github.cdimascio:dotenv-kotlin:6.5.1

  # Database
  - org.jetbrains.exposed:exposed-core:0.61.0
  - org.jetbrains.exposed:exposed-jdbc:0.61.0
  - org.jetbrains.exposed:exposed-java-time:0.61.0
  - com.h2database:h2:2.3.232

  # Authentication
  - org.mindrot:jbcrypt:0.4
  - com.auth0:java-jwt:4.6.2

test-dependencies:
  - $ktor.server.testHost